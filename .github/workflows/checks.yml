name: Content and exercise checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      # https://github.com/actions/checkout/releases/tag/v7.0.1, checked 2026-09-13
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      # https://github.com/actions/setup-python/releases/tag/v7.0.0, checked 2026-09-13
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check local links and unit structure
        run: python3 scripts/check_content.py
      - name: Test the checker, schema extraction and fictional fixtures
        run: python3 -m unittest discover -s tests -v
      - name: Check whitespace in the change
        run: |
          git diff --check
          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            git show --format= --check HEAD
          fi
